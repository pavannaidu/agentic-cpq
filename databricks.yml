bundle:
  name: hs-cpq-demo

include:
  - resources/*.yml

# Generated at build time and excluded from Git; explicitly sync both outputs
# when deploying the app and Genie guidance jobs.
sync:
  include:
    - src/app/static/**
    - src/bootstrap/genie_guidance_docs/*.docx

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  file_path: ${workspace.root_path}/files

variables:
  catalog:
    description: Unity Catalog catalog that stores demo tables and Genie guidance.
    default: pavan_naidu_catalog
  schema:
    description: Schema for the Agentic CPQ demo objects.
    default: hs_cpq_demo
  # Retained only so bundle deployment does not delete the former document
  # volume during the non-destructive migration. Runtime jobs do not use it.
  docs_volume:
    description: Legacy managed document volume retained for migration safety; unused by the app and Genie Agent.
    default: cpq_docs
  genie_guidance_volume:
    description: Existing managed volume attached to the Genie Agent for seller guidance.
    default: cpq_guidance
  genie_space_id:
    description: Existing Genie Agent used for structured CPQ data and cited seller guidance.
  warehouse_id:
    description: SQL warehouse used by the Genie space.
    default: fb3b5c1dee0b9d55
  lakebase_instance:
    description: Lakebase (managed Postgres) database instance backing quotes + catalog.
    default: dbdemosonlinestorepavannaidu
  lakebase_database:
    description: Postgres database created inside the Lakebase instance.
    default: hs_cpq
  jobs_spark_version:
    description: Databricks Runtime used for bootstrap jobs.
    default: 15.4.x-scala2.12
  jobs_cluster_node_type:
    description: Node type used for bootstrap jobs.
    default: i3.xlarge
  agent_prefix:
    description: Prefix used for the Genie Agent title.
    default: hs-cpq
  app_name_prefix:
    description: Prefix for the Databricks App resource.
    default: hs-cpq-seller-demo
  demo_owner_group:
    description: Group that can manage bundle jobs.
    default: users
  run_as_service_principal:
    description: Optional service principal used for prod workflow run_as.
    default: ""

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: FEVM
    variables:
      schema: hs_cpq_demo_dev
      genie_space_id: 01f163adaafc189e852effe4bdced3a8

  prod:
    mode: production
    workspace:
      profile: FEVM
    variables:
      schema: hs_cpq_demo_prod
    run_as:
      service_principal_name: ${var.run_as_service_principal}
