bundle:
  name: agentic-cpq-demo

include:
  - resources/*.yml

# Generated at build time and excluded from Git; explicitly sync both outputs
# when deploying the app and Genie guidance jobs.
sync:
  include:
    - src/app/static/**
    - src/bootstrap/genie_guidance_docs/*.docx

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  file_path: ${workspace.root_path}/files

variables:
  catalog:
    description: Existing Unity Catalog catalog that stores demo tables and Genie guidance.
  schema:
    description: Schema for the Agentic CPQ demo objects.
    default: agentic_cpq_demo
  # Retained so deployments from the original bundle do not remove a managed volume.
  docs_volume:
    description: Legacy managed document volume retained for migration safety; unused by the app.
    default: cpq_docs
  genie_guidance_volume:
    description: Existing managed volume attached to the Genie Agent for seller guidance.
    default: agentic_cpq_guidance
  genie_space_id:
    description: Existing Genie Agent used for structured CPQ data and cited seller guidance.
  warehouse_id:
    description: SQL warehouse used by the Genie space.
  lakebase_instance:
    description: Existing Lakebase Provisioned instance backing quotes and the synced catalog.
  lakebase_database:
    description: Postgres database created inside the Lakebase instance.
    default: agentic_cpq
  jobs_spark_version:
    description: Databricks Runtime used for bootstrap jobs.
    default: 15.4.x-scala2.12
  jobs_cluster_node_type:
    description: Node type used for bootstrap jobs.
    default: i3.xlarge
  agent_prefix:
    description: Prefix used for the Genie Agent title.
    default: agentic-cpq
  app_name_prefix:
    description: Prefix for the Databricks App resource.
    default: agentic-cpq-demo
  quote_model_endpoint:
    description: Model Serving endpoint used by the quote agent.
    default: databricks-gpt-5-6-terra
  followup_model_endpoint:
    description: Model Serving endpoint used for follow-up suggestions.
    default: databricks-gpt-5-6-luna
  plan_confirmation_secret_scope:
    description: Existing Databricks secret scope containing both app runtime keys.
  plan_confirmation_secret_key:
    description: Key within that scope containing a stable random plan confirmation secret.
  lakebase_instance_secret_key:
    description: Key whose value equals lakebase_instance, used when the app mints a database credential.
  demo_owner_group:
    description: Group that can manage bundle jobs.
    default: users
  run_as_service_principal:
    description: Optional service principal used for prod workflow run_as.
    default: ""

targets:
  dev:
    default: true
    mode: development
    variables:
      schema: agentic_cpq_demo_dev

  prod:
    mode: production
    variables:
      schema: agentic_cpq_demo_prod
    run_as:
      service_principal_name: ${var.run_as_service_principal}
