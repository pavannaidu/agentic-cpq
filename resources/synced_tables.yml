# Managed UC -> Lakebase (Postgres) synced tables. The app reads these from the
# Postgres `cpq_ref` schema over its existing psycopg connection; Genie keeps
# reading the UC source tables. Snapshot scheduling refreshes on deploy/run.
# Each source table was made sync-ready by seed_demo_data.py (PRIMARY KEY (id) + CDF).
resources:
  synced_database_tables:
    ref_accounts:
      name: ${resources.schemas.cpq_ref_schema.id}.accounts
      database_instance_name: ${var.lakebase_instance}
      logical_database_name: ${var.lakebase_database}
      spec:
        source_table_full_name: ${var.catalog}.${var.schema}.accounts
        primary_key_columns: [id]
        scheduling_policy: SNAPSHOT
        create_database_objects_if_missing: true
        new_pipeline_spec:
          storage_catalog: ${var.catalog}
          storage_schema: ${var.schema}

    ref_products:
